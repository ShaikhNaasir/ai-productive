# Render Blueprint — deploys the whole app (client + API + AI service + database).
# One click: Render Dashboard > New > Blueprint > pick this repo.
#
# Auto-wired: database URL, service-to-service URLs, CORS origin, shared secret.
# You only set ONE secret by hand: ANTHROPIC_API_KEY (on the productivity-ai service),
# and optionally VOYAGE_API_KEY for semantic search.

databases:
  - name: productivity-db
    plan: free
    postgresMajorVersion: "16"

services:
  # ---- Express API ----
  - type: web
    name: productivity-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate
    # db push creates the schema directly — no migration files needed.
    startCommand: npx prisma db push --accept-data-loss && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: productivity-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: productivity-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: productivity-ai
          envVarKey: RENDER_EXTERNAL_URL
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: productivity-client
          envVarKey: RENDER_EXTERNAL_URL
      - key: EMBEDDINGS_ENABLED
        value: "false"
      - fromGroup: shared-secrets

  # ---- FastAPI AI service ----
  - type: web
    name: productivity-ai
    runtime: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set this in the Render dashboard
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      - key: VOYAGE_API_KEY
        sync: false          # optional (semantic search)
      - key: EMBEDDING_MODEL
        value: voyage-3
      - fromGroup: shared-secrets

  # ---- React client (static site) ----
  - type: web
    name: productivity-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: productivity-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Shared secret so only the API can call the AI service.
envVarGroups:
  - name: shared-secrets
    envVars:
      - key: INTERNAL_API_KEY
        generateValue: true
